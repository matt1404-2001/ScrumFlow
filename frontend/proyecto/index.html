  <body class="pagina-proyecto">

          <path d="M7 9.5h18M7 16h12M7 22.5h7"></path>
          <circle cx="25" cy="22.5" r="2.5"></circle>
        </svg>
        <span>ScrumFlow</span>
      </a>

      <a class="proyecto-actual" href="../proyectos/" aria-label="Cambiar de proyecto">
        <span class="proyecto-actual__simbolo" aria-hidden="true">
          <svg viewBox="0 0 20 20"><path d="M3.5 6.5h13v10h-13zM7 6.5V4.8c0-.7.6-1.3 1.3-1.3h3.4c.7 0 1.3.6 1.3 1.3v1.7M3.5 10h13"></path></svg>

      <div class="perfil-usuario" aria-label="Cuenta de usuario: María López">
        <span class="perfil-usuario__avatar" aria-hidden="true">ML</span>
        <span class="perfil-usuario__datos">
          <strong>María López</strong>

    <div class="estructura-proyecto">
      <aside class="barra-lateral">
        <nav class="navegacion-proyecto" aria-label="Secciones del proyecto">
          <a class="navegacion-proyecto__enlace" href="#resumen" data-seccion="resumen">

            <span>Product Backlog</span>
          </a>
          <a class="navegacion-proyecto__enlace" href="#sprint" data-seccion="sprint">

          </a>
          <a class="navegacion-proyecto__enlace" href="#equipo" data-seccion="equipo">
            <svg viewBox="0 0 20 20" aria-hidden="true"><path d="M7 9a2.6 2.6 0 1 0 0-5.2A2.6 2.6 0 0 0 7 9ZM2.8 16v-2c0-1.7 1.8-3 4.2-3s4.2 1.3 4.2 3v2M13.5 9.2a2.3 2.3 0 1 0 0-4.6M12.8 11.2c2.5-.3 4.4.9 4.4 2.8v2"></path></svg>
