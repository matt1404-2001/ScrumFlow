openapi: 3.0.3
info:
  title: ScrumFlow API
  version: 1.0.0
  description: >-
    Contrato REST para el sistema académico ScrumFlow. Cubre los doce casos de
    uso aprobados sin agregar funcionalidades fuera del alcance.
servers:
  - url: /
    description: Servidor actual
security:
  - bearerAuth: []
tags:
  - name: Auth
  - name: Projects
  - name: Team
  - name: Backlog
  - name: Sprints
  - name: Sprint Board
  - name: Summary
  - name: Daily
  - name: Review
  - name: Retrospective
paths:
  /api/autenticacion/registro:
    post:
      operationId: registerUser
      summary: Registrar usuario
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Cuenta creada sin iniciar sesión.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserSummary'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/proyectos/{projectId}/sprints/{sprintId}/activar:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SprintId'
    post:
      operationId: activateSprint
      summary: Activar Sprint
      tags: [Sprints]
      responses:
        '200':
          description: Sprint activado con copia de la Definition of Done.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SprintSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/proyectos/{projectId}/sprints/{sprintId}/tablero:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SprintId'
    get:
      operationId: getSprintBoard
      summary: Obtener tablero del Sprint
      tags: [Sprint Board]
      responses:
        '200':
          description: Tablero, progreso e impedimentos abiertos.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SprintBoard'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/proyectos/{projectId}/sprints/{sprintId}/elementos/{sprintItemId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SprintId'
      - $ref: '#/components/parameters/SprintItemId'
    get:
      operationId: getSprintItem
      summary: Consultar tarjeta del Sprint
      tags: [Sprint Board]
      responses:
        '200':
          description: Detalle completo de la tarjeta.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SprintBoardItem'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateSprintItem
      summary: Actualizar tarjeta, checklist y Definition of Done
      description: >-
        Si estado es TERMINADO, confirmarDod debe ser true. El backend registra
        automáticamente el miembro autenticado y el momento de confirmación.
      tags: [Sprint Board]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SprintItemPatchRequest'
      responses:
        '200':
          description: Tarjeta actualizada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SprintBoardItem'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/proyectos/{projectId}/sprints/{sprintId}/elementos/{sprintItemId}/comentarios:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SprintId'
      - $ref: '#/components/parameters/SprintItemId'
    post:
      operationId: createSprintComment
      summary: Publicar comentario en una tarjeta
      tags: [Sprint Board]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreateRequest'
      responses:
        '201':
          description: Comentario registrado con autor y fecha.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SprintComment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/proyectos/{projectId}/sprints/{sprintId}/impedimentos:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SprintId'
    post:
      operationId: createImpediment
      summary: Registrar impedimento
      tags: [Sprint Board]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImpedimentCreateRequest'
      responses:
        '201':
          description: Impedimento abierto registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Impediment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/proyectos/{projectId}/sprints/{sprintId}/impedimentos/{impedimentId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SprintId'
      - $ref: '#/components/parameters/ImpedimentId'
    patch:
      operationId: resolveImpediment
      summary: Resolver impedimento
      tags: [Sprint Board]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ImpedimentResolveRequest'
      responses:
        '200':
          description: Impedimento resuelto con miembro y fecha.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Impediment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/proyectos/{projectId}/sprints/{sprintId}/iniciar-cierre:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SprintId'
    post:
      operationId: startSprintClosing
      summary: Iniciar cierre del Sprint
      tags: [Sprints]
      responses:
        '200':
          description: Sprint En cierre y tablero bloqueado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SprintClosingResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/proyectos/{projectId}/resumen:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getProjectSummary
      summary: Consultar resumen y guía del proyecto
      tags: [Summary]
      responses:
        '200':
          description: Estado agregado, recomendación principal y alertas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDashboardSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/proyectos/{projectId}/sprints/{sprintId}/reuniones-diarias/hoy:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SprintId'
    get:
      operationId: getTodayDaily
      summary: Consultar detalle de la Daily del día
      tags: [Daily]
      responses:
        '200':
          description: Daily completa o representación virtual Programada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/proyectos/{projectId}/sprints/{sprintId}/reuniones-diarias/iniciar:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SprintId'
    post:
      operationId: startDaily
      summary: Iniciar Daily explícitamente
      tags: [Daily]
      responses:
        '201':
          description: Daily En curso con integrantes esperados e iniciador presente.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/proyectos/{projectId}/sprints/{sprintId}/reuniones-diarias/{dailyId}/unirse:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SprintId'
      - $ref: '#/components/parameters/DailyId'
    post:
      operationId: joinDaily
      summary: Unirse a la Daily
      tags: [Daily]
      responses:
        '200':
          description: Participación registrada o recuperada sin duplicarla.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyJoinResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/proyectos/{projectId}/sprints/{sprintId}/reuniones-diarias/{dailyId}/mensajes:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SprintId'
      - $ref: '#/components/parameters/DailyId'
    post:
      operationId: createDailyMessage
      summary: Publicar mensaje, avance o impedimento
      tags: [Daily]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DailyMessageCreateRequest'
      responses:
        '201':
          description: Publicación registrada y posible impedimento creado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyMessageCreateResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/proyectos/{projectId}/sprints/{sprintId}/reuniones-diarias/{dailyId}/finalizar:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SprintId'
      - $ref: '#/components/parameters/DailyId'
    post:
      operationId: finishDaily
      summary: Finalizar Daily
      tags: [Daily]
      responses:
        '200':
          description: Daily Finalizada y ausencias determinadas.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DailyFinishResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/proyectos/{projectId}/sprints/{sprintId}/reuniones-diarias:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/SprintId'
    get:
      operationId: listSprintDailies
      summary: Consultar historial completo de Dailies
      tags: [Daily]
      responses:
        '200':
          description: Dailies ordenadas desde la más reciente con detalle suficiente.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/DailyDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/autenticacion/inicio-sesion:
    post:
      operationId: login
      summary: Iniciar sesión y obtener JWT
      tags: [Auth]
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Credenciales válidas y JWT emitido.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/proyectos:
    get:
      operationId: listUserProjects
      summary: Listar proyectos del usuario
      tags: [Projects]
      responses:
        '200':
          description: Proyectos con membresía activa.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ProjectSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createProject
      summary: Crear proyecto Scrum
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCreateRequest'
      responses:
        '201':
          description: Proyecto y membresía administrativa creados.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/proyectos/{projectId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getProject
      summary: Consultar proyecto
      tags: [Projects]
      responses:
        '200':
          description: Detalle del proyecto y membresía actual.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    patch:
      operationId: updateProject
      summary: Editar proyecto y Definition of Done
      tags: [Projects]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectPatchRequest'
      responses:
        '200':
          description: Proyecto actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectDetail'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/invitaciones:
    get:
      operationId: listUserInvitations
      summary: Consultar invitaciones del usuario
      tags: [Team]
      parameters:
        - $ref: '#/components/parameters/InvitationState'
      responses:
        '200':
          description: Invitaciones dirigidas al usuario.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Invitation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/proyectos/{projectId}/invitaciones:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    post:
      operationId: createProjectInvitation
      summary: Invitar usuario registrado
      tags: [Team]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationCreateRequest'
      responses:
        '201':
          description: Invitación interna creada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Invitation'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/invitaciones/{invitationId}:
    parameters:
      - $ref: '#/components/parameters/InvitationId'
    patch:
      operationId: respondInvitation
      summary: Aceptar o rechazar invitación
      tags: [Team]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InvitationDecisionRequest'
      responses:
        '200':
          description: Invitación respondida.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InvitationDecisionResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/proyectos/{projectId}/equipo:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getProjectTeam
      summary: Consultar equipo y acuerdos
      tags: [Team]
      responses:
        '200':
          description: Equipo, responsabilidades, DoD e invitaciones visibles.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/proyectos/{projectId}/equipo/{memberId}:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
      - $ref: '#/components/parameters/MemberId'
    patch:
      operationId: updateTeamMember
      summary: Modificar permiso y responsabilidades del integrante
      tags: [Team]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TeamMemberPatchRequest'
      responses:
        '200':
          description: Integrante actualizado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TeamMember'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
    delete:
      operationId: removeTeamMember
      summary: Retirar integrante del proyecto
      tags: [Team]
      responses:
        '204':
          description: Integrante retirado; historial conservado.
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
  /api/proyectos/{projectId}/backlog:
    parameters:
      - $ref: '#/components/parameters/ProjectId'
    get:
      operationId: getProductBacklog
      summary: Consultar Product Goal y backlog
      tags: [Backlog]
      parameters:
        - $ref: '#/components/parameters/IncludeRetired'
      responses:
        '200':
          description: Product Goal y elementos con información completa para el panel lateral.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BacklogResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: createBacklogItem
      summary: Crear elemento del Product Backlog
      tags: [Backlog]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BacklogCreateRequest'
      responses:
        '201':
