        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT emitido por POST /api/autenticacion/inicio-sesion.

  parameters:
    ProjectId:
      name: projectId
      in: path
      required: true
      description: Identificador del proyecto.
      schema:
        type: integer
        format: int64
        minimum: 1
    InvitationId:
      name: invitationId
      in: path
      required: true
      description: Identificador de la invitación.
      schema:
        type: integer
        format: int64
        minimum: 1
    MemberId:
      name: memberId
      in: path
      required: true
      description: Identificador de la membresía del proyecto.
      schema:
        type: integer
        format: int64
        minimum: 1
    BacklogItemId:
      name: itemId
      in: path
      required: true
      description: Identificador del elemento del Product Backlog.
      schema:
        type: integer
        format: int64
        minimum: 1
    SprintId:
      name: sprintId
      in: path
      required: true
      description: Identificador del Sprint.
      schema:
        type: integer
        format: int64
        minimum: 1
    SprintItemId:
      name: sprintItemId
      in: path
      required: true
      description: Identificador del elemento dentro del Sprint.
      schema:
        type: integer
        format: int64
        minimum: 1
    ImpedimentId:
      name: impedimentId
      in: path
      required: true
      description: Identificador del impedimento.
      schema:
        type: integer
        format: int64
        minimum: 1
    DailyId:
      name: dailyId
      in: path
      required: true
      description: Identificador de la Daily Scrum.
      schema:
        type: integer
        format: int64
        minimum: 1
    ActionId:
      name: actionId
      in: path
      required: true
      description: Identificador de la acción de mejora.
      schema:
        type: integer
        format: int64
        minimum: 1
    InvitationState:
      name: estado
      in: query
      required: false
      description: Filtra las invitaciones por estado.
      schema:
        $ref: '#/components/schemas/InvitationState'
    IncludeRetired:
      name: includeRetired
      in: query
      required: false
      description: Incluye elementos retirados del backlog.
      schema:
        type: boolean
        default: false
    SprintState:
      name: estado
      in: query
      required: false
      description: Filtra los Sprints por estado.
      schema:
        $ref: '#/components/schemas/SprintState'

  responses:
    BadRequest:
      description: Solicitud mal formada o parámetros inválidos.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: JWT ausente, inválido o expirado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: El usuario autenticado no tiene permiso para la operación.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Recurso inexistente o no visible para el usuario.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: La operación contradice el estado actual o una regla de unicidad.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: Uno o más datos no cumplen las validaciones funcionales.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    InternalError:
      description: Error interno no esperado.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    Priority:
      type: string
      enum: [BAJA, MEDIA, ALTA]
    InvitationState:
      type: string
      enum: [PENDIENTE, ACEPTADA, RECHAZADA]
    SprintState:
      type: string
      enum: [BORRADOR, ACTIVO, EN_CIERRE, FINALIZADO]
    SprintItemState:
      type: string
      enum: [PENDIENTE, EN_PROGRESO, TERMINADO]
    ImpedimentState:
      type: string
      enum: [ABIERTO, RESUELTO]
    DailyState:
      type: string
      enum: [PROGRAMADA, EN_CURSO, FINALIZADA]
    DailyMessageType:
      type: string
      enum: [MENSAJE, AVANCE, IMPEDIMENTO]
    EventRecordState:
      type: string
      enum: [BORRADOR, COMPLETADA]

    RegisterRequest:
      type: object
      additionalProperties: false
      required: [nombre, correo, contrasena, confirmacionContrasena]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 150
        correo:
          type: string
          format: email
          maxLength: 254
        contrasena:
          type: string
          format: password
          minLength: 12
          description: Debe contener al menos un número y un símbolo.
        confirmacionContrasena:
          type: string
          format: password
          minLength: 12
          description: Debe coincidir con contrasena.
    LoginRequest:
      type: object
      additionalProperties: false
      required: [correo, contrasena]
      properties:
        correo:
          type: string
          format: email
        contrasena:
          type: string
          format: password
    LoginResponse:
      type: object
      additionalProperties: false
      required: [token, expiresAt, user]
      properties:
        token:
          type: string
          description: JWT firmado por el backend.
        expiresAt:
          type: string
          format: date-time
        user:
          $ref: '#/components/schemas/UserSummary'
    UserSummary:
      type: object
      additionalProperties: false
      required: [userId, nombre, correo]
      properties:
        userId:
          type: integer
          format: int64
          minimum: 1
        nombre:
          type: string
        correo:
          type: string
          format: email
    MemberSummary:
      type: object
      additionalProperties: false
      required: [miembroProyectoId, userId, nombre]
      properties:
        miembroProyectoId:
          type: integer
          format: int64
          minimum: 1
        userId:
          type: integer
          format: int64
          minimum: 1
        nombre:
          type: string
    ProjectMembership:
      type: object
      additionalProperties: false
      required: [miembroProyectoId, esAdministrador, esProductOwner, esScrumMaster, esDeveloper]
      properties:
        miembroProyectoId:
          type: integer
          format: int64
          minimum: 1
        projectId:
          type: integer
          format: int64
          minimum: 1
        userId:
          type: integer
          format: int64
          minimum: 1
        esAdministrador:
          type: boolean
        esProductOwner:
          type: boolean
        esScrumMaster:
          type: boolean
        esDeveloper:
          type: boolean
    ProjectSummary:
      type: object
      additionalProperties: false
      required: [projectId, nombre, descripcion, esAdministrador]
      properties:
        projectId:
          type: integer
          format: int64
          minimum: 1
        nombre:
          type: string
        descripcion:
          type: string
          nullable: true
        esAdministrador:
          type: boolean
    ProjectCreateRequest:
      type: object
      additionalProperties: false
      required: [nombre]
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 150
        descripcion:
          type: string
          nullable: true
    ProjectPatchRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 150
        descripcion:
          type: string
          nullable: true
        definitionOfDone:
          type: string
          nullable: true
          description: Acuerdo vigente del equipo como texto multilínea.
    ProjectDetail:
      type: object
      additionalProperties: false
      required: [projectId, nombre, descripcion, productGoal, definitionOfDone, currentUserMembership]
      properties:
        projectId:
          type: integer
          format: int64
          minimum: 1
        nombre:
          type: string
        descripcion:
          type: string
          nullable: true
        productGoal:
          type: string
          nullable: true
        definitionOfDone:
          type: string
          nullable: true
        currentUserMembership:
          $ref: '#/components/schemas/ProjectMembership'
    ProjectReference:
      type: object
      additionalProperties: false
      required: [projectId, nombre]
      properties:
        projectId:
          type: integer
          format: int64
          minimum: 1
        nombre:
          type: string
    Invitation:
      type: object
      additionalProperties: false
      required: [invitationId, estado, fechaCreacion]
      properties:
        invitationId:
          type: integer
          format: int64
          minimum: 1
        projectId:
          type: integer
          format: int64
          minimum: 1
        project:
          $ref: '#/components/schemas/ProjectReference'
        usuarioInvitado:
          $ref: '#/components/schemas/UserSummary'
        invitadoPor:
          $ref: '#/components/schemas/UserSummary'
        estado:
          $ref: '#/components/schemas/InvitationState'
        fechaCreacion:
          type: string
          format: date-time
        fechaRespuesta:
          type: string
          format: date-time
          nullable: true
    InvitationCreateRequest:
      type: object
